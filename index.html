<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b12" />
  <title>ScreenCity Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #070b12; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .card {
      width: min(760px, 100%);
      border: 1px solid #1e293b;
      border-radius: 28px;
      padding: 48px 34px;
      background: #0b111b;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
    }
    .brand { font-size: clamp(36px, 8vw, 64px); font-weight: 800; letter-spacing: -2px; }
    .brand span { color: #7c5cff; }
    .tag { margin-top: 10px; color: #9fb0c7; font-size: 18px; }
    .button {
      display: block;
      margin: 38px auto 18px;
      width: min(520px, 100%);
      padding: 24px 26px;
      border-radius: 18px;
      background: #6d5dfc;
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
      border: 2px solid transparent;
    }
    .button:focus, .button:hover {
      outline: none;
      border-color: #fff;
      transform: scale(1.01);
    }
    .info { color: #8090a6; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Screen<span>City</span></div>
    <div class="tag">Player para mídia indoor</div>
    <a class="button" href="/ScreenCity.apk" download>BAIXAR SCREENCITY</a>
    <div class="info">APK assinado • 20.6 MB<br>Toque no botão acima para instalar no Android Stick.</div>
  </main>
</body>
</html>
